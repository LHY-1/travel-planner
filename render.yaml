services:
  - type: web
    name: travel-planner
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12
      - key: TONGCHENG_TOKEN
        sync: false
      - key: TONGCHENG_USER_ID
        sync: false
